services:
  astro:
    image: node:22-alpine
    working_dir: /app

    environment:
      - NODE_ENV=development
      # Required for hot reload when running Docker on Windows/Mac (bind mounts)
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

    ports:
      - "4321:4321"

    volumes:
      # source code (live-synced)
      - .:/app
      # isolated node_modules so the container's native binaries aren't overwritten by the host
      - astro_node_modules:/app/node_modules

    # corepack ships with Node 22 — use it to activate pnpm without a separate install step
    command: sh -c "corepack enable && pnpm install && pnpm dev -- --host 0.0.0.0"

    stdin_open: true
    tty: true

volumes:
  astro_node_modules:
